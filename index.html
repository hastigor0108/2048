<html>
  <head>
    <title>2048 Game</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
  <!--game main box-->
    <div class="container">
      <h1>2048</h1>
  <!--score box-->
      <div class="score-box">
        Score: <span id="score">0</span>
      </div>
  <!--grid box-->
      <div class="grid" id="grid"></div>
  <!--restart button-->
      <button onclick="startGame()">Restart</button>
    </div>
    
  <!--script file-->
    <script src="script.js"></script>
  </body>
</html>
